experiment_name: "bates_kou_bsiv_surrogate"
seed: 42
device: "cuda"
model_config: "configs/model/mlp.yaml"
mode: "active"
target_type: "bsiv"

data:
  bounds:
    moneyness: [-0.60, 0.60]
    maturity_days: [1.00, 365.000]
    spot_var: [0.01, 0.900]
    risk_free_rate: [0.00, 0.075]
    dividend_yield: [0.00, 0.050]
    kappa: [0.10, 50.000]
    long_run_var: [0.01, 0.900]
    sigma: [0.10, 5.000]
    rho: [-1.00, 0.000]
    jump_intensity: [0.00, 4.000]
    nu_u: [0.00, 0.400]
    nu_d: [0.00, 0.400]
    p_up: [0.00, 1.000]

training:
  # Options: "cosine" | "step"
  lr_scheduler: "cosine"
  batch_size: 512
  eval_batch_size: 16384
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  lr_patience: 2
  lr_factor: 0.5
  weight_decay: 0.0
  loss_fn: "bsiv"
  use_vega_loss: false
  use_amp: false

# Label budget B = initial + rounds * query = 10k + 25 * 3k = 85k (~80k after BSIV validity filter).
# Passive baseline gets the same 80k training labels (100k * 0.8) for a fair comparison.
passive:
  n_samples: 100000
  train_split: 0.8
  epochs: 150

active:
  # Options: "uncertainty" | "grad_norm" | "vega_uncertainty" | "delta_variance" | "ema" | "curvature"
  acquisition_strategy: "grad_norm"
  uniform_ratio: 0.25
  initial_samples: 100000
  rounds: 50
  query_size: 20000
  pool_size: 100000
  mc_passes: 20
  val_samples: 200000
  epochs_per_round: 20
  target_val_loss: 0.001
  early_stopping_patience: 15
  curvature_weight: 1.0

# Two-Stage Optuna Pipeline:
# Stage 1 finds a reliable Architecture + Optimizer + LR Scheduler on a 120k-sample difficulty-weighted dataset.
# Stage 2 locks in Stage 1 and tunes Active Learning strategy on a 150k-sample (50k + 8x12.5k) active trajectory,
# while preserving the full 1.1M-sample / 50-round marathon schedule for final training.
optuna:
  val_samples: 100000
  startup_trials: 20
  # Stage 1: Architecture + Optimizer + LR Scheduler
  stage1_study_name: "bsiv_stage1_arch"
  stage1_storage: "optuna/bsiv_stage1_arch.journal"
  stage1_trials: 100
  stage1_train_samples: 120000
  stage1_epochs: 45
  stage1_report_every: 3
  stage1_prune_warmup_reports: 4
  # Stage 2: Active Learning Strategy (50k init + 8 rounds * 12.5k query = 150k trajectory)
  stage2_study_name: "bsiv_stage2_active"
  stage2_storage: "optuna/bsiv_stage2_active.journal"
  stage2_trials: 50
  stage2_initial_samples: 50000
  stage2_rounds: 8
  stage2_query_size: 12500
  stage2_pool_size: 40000
  mc_passes: 10
  stage2_prune_warmup_rounds: 3
